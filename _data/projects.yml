- title: Research Ready Intern - Google DeepMind (with University of Exeter)
  description: "Worked on \"Scientific Paper Understanding with Multimodal LLMs and Knowledge Graphs\" under the supervision of Dr. Hang Dong and Dr. Zhang Guioqang. Developed and evaluated methods to improve the quality and contextual accuracy of image captioning for figures within scientific papers. Worked with multimodal architectures to bridge the gap between visual (figures, graphs) and textual (paper content) information. Designed prompt sets and a human evaluation rubric for scientific-figure captioning; piloted LLM-as-judge checks for factual consistency. Built a lightweight evaluation harness for output correctness (batch runs, scoring, error taxonomy, reporting) to surface failure modes."
  link: /assets/documents/gdrr_presentation_final.pdf
  link_text: See the poster (PDF)
  image: /assets/images/adversarial-prompting/gdrr-poster.png

- title: Muse
  description: "Designed, built, and managed a natural-language + multimodal search turning a few image/text references into curated adjacent inspirations. Implemented vibe-first retrieval with embeddings and lightweight descriptors; hybrid queries and diversity re-rank for fuzzy, intuitive exploration. Delivered branching exploration and reproducible recipes (blend/regenerate, scope, minimum score, pin/ban) with deduplication and session memory."
