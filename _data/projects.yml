- title: Patina Systems - Location-Based Image Matching API
  description: "Designed a FastAPI microservice that performs geospatially-aware image matching as a core product component for a stealth-mode startup. Implemented GPU-accelerated feature extraction and approximate nearest-neighbour search for real-time image matching capabilities. Delivered full technical documentation and hand-off while maintaining NDA confidentiality throughout the development process."
  link: https://patinasystems.com/
  link_text: Visit Patina Systems

- title: Pagerift - Creative Writing LLM Fine-Tuning
  description: "Fine-tuned a Large Language Model (Gemma 3) specifically for creative story writing, optimising the model for narrative coherence and stylistic consistency. Integrated the DSPy framework to improve model output quality through structured prompting and automated optimization techniques. Provided comprehensive consulting on backend development architecture and scalable ML deployment strategies. Developed custom evaluation metrics for creative writing quality assessment and iterative model improvement."
  link: https://pagerift.com/
  link_text: Visit Pagerift

- title: BSc Dissertation - Automatic Detection of Diabetic Retinopathy on Edge Devices
  description: "Investigated and compared Vision Transformer (ViT) and CNN architectures for detecting diabetic retinopathy, focusing on deployment to resource-constrained hardware. Designed and implemented robust data-gathering and preprocessing pipelines for large-scale retinal image datasets to ensure valid training and evaluation splits. Applied model optimisation techniques, including quantisation and pruning, to reduce model size and enable efficient inference on embedded devices. Authored a formal dissertation covering methodology, experimental analysis, results, and deployment lessons learned."

- title: No Stylist
  description: "Helped build the machine-learning backend for a fashion application, handling large-scale image processing and similarity matching. Designed and implemented a product-similarity image-retrieval model using ResNet-50, experimenting with contrastive and triplet loss functions to achieve higher accuracy. Developed a core feature using a YOLOv8n model for clothing detection in user-uploaded images, enabling automated fashion item categorization. Optimised large-scale image datasets and leveraged high-performance GPUs for model training and deployment. Experimented with a sophisticated user avatar generation pipeline by chaining multiple deep learning models, including pose estimation, facial landmark detection, and generative adversarial networks for realistic avatar synthesis."
  link: https://youtube.com/shorts/Wo5HfW8VT20?feature=share
  link_text: See the demo on YouTube
